services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hak-bul-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/__pycache__
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hak-bul-frontend
    ports:
      - "5173:80" # Frontend'e tarayıcıdan localhost:5173 ile erişebilmek için
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    depends_on:
      - backend # Frontend'in backend'den sonra ayağa kalkmasını sağlar