services:
  postgres:
    image: postgres:16-alpine
    container_name: hak-bul-postgres
    env_file:
      - ./backend/.env.docker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: dev-Dockerfile
    container_name: hak-bul-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.docker      # ← .env.docker kullanılıyor, DATABASE_URL içinde
    volumes:
      - ./backend:/app
      - /app/venv
      - /app/__pycache__
      - model_data:/model_cache
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: dev-Dockerfile
    container_name: hak-bul-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_MOCK_MODE=false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  model_data:
  postgres_data:
  frontend_node_modules:
